# Kueue cluster-scoped objects for GPU queue management.
# Apply after the KubeRay and Kueue CRDs are installed.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-flavor
spec:
  nodeLabels:
    workload-type: gpu-training
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-canary-flavor
spec:
  nodeLabels:
    workload-type: gpu-canary
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-performance-flavor
spec:
  nodeLabels:
    workload-type: gpu-performance
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: research-low
value: 1000
description: "Default priority for research and canary jobs"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: production-high
value: 10000
description: "High priority for production training"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: training-queue
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - auto-e2e-development
          - auto-e2e-training
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "40"
            - name: memory
              nominalQuota: 160Gi
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: gpu-flavor
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "8"
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Never
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-canary-queue
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: auto-e2e-development
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "16"
            - name: memory
              nominalQuota: 64Gi
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: gpu-canary-flavor
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "2"
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-performance-queue
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: auto-e2e-development
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "24"
            - name: memory
              nominalQuota: 96Gi
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: gpu-performance-flavor
          resources:
            - name: nvidia.com/gpu
              nominalQuota: "4"
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: training
  namespace: auto-e2e-training
  annotations:
    kueue.x-k8s.io/default-queue: "true"
spec:
  clusterQueue: training-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-canary
  namespace: auto-e2e-development
spec:
  clusterQueue: gpu-canary-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gpu-performance
  namespace: auto-e2e-development
spec:
  clusterQueue: gpu-performance-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: training
  namespace: auto-e2e-development
  annotations:
    kueue.x-k8s.io/default-queue: "true"
spec:
  clusterQueue: training-queue
